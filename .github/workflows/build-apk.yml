
name: Build RetroSound One APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/retrosound-one-1-0-rc1
      - feature/retrosound-one-1-4

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        env:
          # Public HTTPS relay URL. Email provider secrets remain on the relay server.
          RETROSOUND_DIAGNOSTICS_ENDPOINT: ${{ vars.RETROSOUND_DIAGNOSTICS_ENDPOINT }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroSoundOne-1.4-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
